name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check backend import
        run: python -c "from backend.app.main import app; print(app.title)"

  engine:
    name: Engine build and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-format

      - name: Build engine
        run: make LDLIBS=

      - name: Run engine tests
        run: make test LDLIBS=

      - name: Check engine formatting
        run: make format-check

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker files
        id: docker_files
        run: |
          if [ -f docker-compose.yml ] && [ -f Dockerfile.backend ] && [ -f Dockerfile.frontend ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker images
        if: steps.docker_files.outputs.exists == 'true'
        run: docker compose build

      - name: Skip Docker build
        if: steps.docker_files.outputs.exists != 'true'
        run: echo "Docker files not found, skipping Docker build."
